# Demo config – fill your local paths
# Note: Use forward slashes or double backslashes in YAML paths
logs_path: "D:/workspace/mall-service/logs/app.log"          # 你的 web 服务日志文件（请修改为真实路径）
repo_path: "D:/workspace/mall-service"  # 你的 Maven 项目根目录（请修改为真实路径）
java_build: "maven"
branch_prefix: "fix/"
llm:
    base_url: "https://token-plan-cn.xiaomimimo.com/v1"
    provider: "openai"
    model: "mimo-v2.5-pro"
    api_key_env: "MIMO_API_KEY"
    # base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # provider: "dashscope"
    # model: "qwen3-max"
    # api_key_env: "DASHSCOPE_API_KEY"
    temperature: 0.2
    timeout: 300
max_patch_lines: 40
max_tokens: 8192
auto_apply: false
run_compile_on_apply: true
run_tests_on_apply: false
max_retries: 3

# Gitee integration (for PR creation)
gitee:
  enabled: true // 控制是否启用 Gitee 集成，默认为 false
  owner: "ch6enle"                     # auto-detected from git remote if empty
  repo: "mall-service"                      # auto-detected from git remote if empty
  access_token_env: "089c2d475d16140472cce6629deaa2d7"
  api_base_url: "https://gitee.com/api/v5"
  target_branch: "zhy"
  pr_title_template: "fix: auto-fix {exception_type} in {class_name}"

