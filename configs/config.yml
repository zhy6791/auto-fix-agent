# Demo config – fill your local paths
# Note: Use forward slashes or double backslashes in YAML paths
# logs_path: "D:/workspace-repo/mall-service/logs/app.log"          # 你的 web 服务日志文件（请修改为真实路径）
# repo_path: "D:/workspace-repo/mall-service"  # 你的 Maven 项目根目录（请修改为真实路径）
logs_path: "D:\\workspace-repo\\sky-take-out\\sky.log"
repo_path: "D:\\workspace-repo\\sky-take-out"
java_build: "maven"
branch_prefix: "fix/"
llm:
    base_url: "https://token-plan-cn.xiaomimimo.com/v1"
    provider: "openai"
    model: "mimo-v2.5-pro"
    api_key_env: "MIMO_API_KEY"
    # base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # provider: "dashscope"
    # model: "qwen3-max"
    # api_key_env: "DASHSCOPE_API_KEY"
    # base_url: "https://api.deepseek.com"
    # provider: "openai"
    # model: "deepseek-v4-pro"
    # api_key_env: "DEEPSEEK_API_KEY"
    temperature: 0.2
    timeout: 300
max_patch_lines: 40
max_tokens: 8192
auto_apply: false
run_compile_on_apply: true
run_tests_on_apply: true
max_retries: 3

# 自动生成测试
generate_tests: true            # 是否启用自动生成 JUnit 测试
test_gen_max_tokens: 4096       # 测试生成的 LLM 最大 token 数
command_whitelist:
  - mvnw.cmd
  - mvnw
  - mvn.cmd
  - mvn.bat
  - mvn
  - gradlew.bat
  - gradlew
  - gradle.bat
  - gradle.cmd
  - gradle

# Gitee integration (for PR creation)
gitee:
  enabled: true
  owner: "zhao-haoyuan4353"                     # auto-detected from git remote if empty
  #repo: "mall-service" 
  repo: "sky-take-out"                     
  access_token_env: "GITEE_ACCESS_TOKEN"  # Set this environment variable to your Gitee personal access token
  api_base_url: "https://gitee.com/api/v5"
  target_branch: "master"
  pr_title_template: "fix: auto-fix {exception_type} in {class_name}"
  # When tests are enabled, require both compile + tests to pass before PR
  require_tests_to_pass_for_pr: true

# OrcaLoca 增强定位配置（图谱搜索内嵌于infer_source工具）
orcaloca:
  enabled: true                    # 是否启用 OrcaLoca 增强定位
  max_files: 10000                 # 最大解析文件数
  build_timeout: 60                # 图构建超时（秒）

